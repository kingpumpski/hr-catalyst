name: Pin official Supabase browser SDK

on:
  push:
    branches:
      - feat/supabase-auth-owner-workspace
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/pin-supabase-sdk.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.event.head_commit.message != 'chore: pin official Supabase SDK [automation]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/supabase-auth-owner-workspace
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Resolve and pin official Supabase SDK
        run: npm install --package-lock-only --save-exact @supabase/supabase-js@2

      - name: Commit generated npm manifest and lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Supabase SDK and lockfile are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: pin official Supabase SDK [automation]"
          git push origin HEAD:feat/supabase-auth-owner-workspace
