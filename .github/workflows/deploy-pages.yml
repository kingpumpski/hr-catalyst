name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel an active Pages deployment when another main-branch push arrives.
# GitHub Pages allows only one active deployment at a time.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Validate production Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/assets
          test -n "$(find dist/assets -maxdepth 1 -type f | head -n 1)"
          if grep -qE 'src/main[.]tsx|/src/main[.]tsx' dist/index.html; then
            echo "Production HTML still references the Vite development entry point."
            exit 1
          fi
          if ! grep -q '/hr-catalyst/assets/' dist/index.html; then
            echo "Production HTML is missing the GitHub Pages project asset base path."
            exit 1
          fi

      - name: Prepare SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
