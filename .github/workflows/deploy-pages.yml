name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel an active Pages deployment when another main-branch push arrives.
# GitHub Pages allows only one active deployment at a time.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Validate production Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/assets
          test -n "$(find dist/assets -maxdepth 1 -type f | head -n 1)"
          if grep -qE 'src/main[.]tsx|/src/main[.]tsx' dist/index.html; then
            echo "Production HTML still references the Vite development entry point."
            exit 1
          fi
          if ! grep -q '/hr-catalyst/assets/' dist/index.html; then
            echo "Production HTML is missing the GitHub Pages project asset base path."
            exit 1
          fi

          # Guard against a successful deployment that bundles stale profile dates.
          expected_profile_dates=(
            "April 2021 - Present"
            "February 2019 - March 2021"
            "July 2014 - August 2017"
            "June 2012 - June 2014"
            "October 2011 - May 2012"
          )
          for expected_date in "${expected_profile_dates[@]}"; do
            if ! grep -R -F -q -- "${expected_date}" dist/assets; then
              echo "Built application is missing expected profile date: ${expected_date}"
              exit 1
            fi
          done

      - name: Prepare SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify published site and SPA fallback
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail

          if [[ -z "${PAGES_URL}" ]]; then
            echo "GitHub Pages deployment did not return a page URL."
            exit 1
          fi

          # GitHub Pages can take a short time to serve a newly deployed artifact.
          for attempt in {1..10}; do
            if curl --fail --silent --show-error --location "${PAGES_URL}" -o /tmp/pages-home.html; then
              break
            fi
            if [[ "${attempt}" -eq 10 ]]; then
              echo "Published GitHub Pages home page did not become reachable."
              exit 1
            fi
            sleep 6
          done

          if ! grep -q '/hr-catalyst/assets/' /tmp/pages-home.html; then
            echo "Published home page is missing the expected project asset base path."
            exit 1
          fi

          # GitHub Pages serves the copied index.html as a 404 fallback for SPA routes.
          route_status="$(curl --silent --show-error --location --output /tmp/pages-spa-route.html --write-out '%{http_code}' "${PAGES_URL%/}/__pages_spa_smoke_test__")"
          if [[ "${route_status}" != "404" ]]; then
            echo "Expected the SPA fallback route to return GitHub Pages' 404 status; got ${route_status}."
            exit 1
          fi

          if ! grep -q '/hr-catalyst/assets/' /tmp/pages-spa-route.html; then
            echo "The SPA fallback response does not contain the built application entrypoint."
            exit 1
          fi

          echo "GitHub Pages home page and SPA fallback are serving the production application."
