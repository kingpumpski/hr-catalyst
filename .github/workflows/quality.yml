name: Quality

on:
  push:
    branches: [main, career-update-vehicle-accounting]
  pull_request:
    branches: [main]

jobs:
  pin-supabase-sdk-lock:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.sha == 'b68c837a385fd40754609a88234437dac018116a'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/supabase-auth-owner-workspace
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Resolve and pin official Supabase SDK
        run: npm install --package-lock-only --save-exact @supabase/supabase-js@2
      - name: Commit generated npm manifest and lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Supabase SDK and lockfile are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: pin official Supabase SDK [automation]"
          git push origin HEAD:feat/supabase-auth-owner-workspace

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
